name: Release

# Channel model: the patch number IS the channel. A `vX.Y.0` tag is a stable
# release and updates the `plank-agent` Homebrew formula; any `vX.Y.Z` with
# Z >= 1 is a beta and updates `plank-agent-beta`. Beta work accumulates as
# patch releases within a series (v2.5.1, v2.5.2, ...); promotion
# (promote.yml) tags the next minor's `.0` as the new stable and opens `.1`
# as the new beta.
#
# Homebrew (aovestdipaperino/homebrew-tap) is the macOS distribution
# channel. Every release also carries plain archives for macOS, Linux
# (x86_64, aarch64) and Windows (x86_64), with a SHA256SUMS over them; the
# Linux and Windows builds have no ds4 engine (Gemma and Flint on the CPU,
# see #89). plank is not published to crates.io.

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  channel:
    name: Determine channel
    # Plank versions only: the `ds4core-*` releases of pre-built engine cores
    # (ds4core.yml) are created with GITHUB_TOKEN, which raises no event, but
    # one published by hand must not build and tap a plank release either.
    # Every other job needs this one, so they skip with it.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.detect.outputs.channel }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect channel from patch number
        id: detect
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          if [ "$PATCH" = "0" ]; then
            CHANNEL=stable
          else
            CHANNEL=beta
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Release $VERSION (patch $PATCH) -> $CHANNEL"

  build:
    name: Build ${{ matrix.name }}
    needs: channel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 runners: the ds4 Metal backend needs the macOS 15 SDK
          # (MTLResidencySet). cpu_flag overrides the ds4 Makefile's
          # `-mcpu=native` default with a portable baseline for bottles.
          #
          # arm64 only. Real inference wants Metal and enough unified memory to
          # hold an ~87 GB model, which no Intel Mac has, so an x86_64 build
          # could only ever ship the engine-less stub — not worth building,
          # bottling, or having Homebrew prefer over a source build.
          - name: aarch64-macos
            runner: macos-15
            target: aarch64-apple-darwin
            bottle_tag: arm64_sequoia
            cpu_flag: "-mcpu=apple-m1"
          # Linux and Windows: default features, no ds4 engine (its build is
          # macOS/Metal only here), so Gemma and Flint run on the CPU. CUDA
          # variants can follow separately, where licensing allows. Each runner
          # is native to its target so the smoke test below can run the binary.
          - name: x86_64-linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            no_ds4: "1"
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            no_ds4: "1"
          - name: x86_64-windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            no_ds4: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        env:
          NATIVE_CPU_FLAG: ${{ matrix.cpu_flag }}
          PLANK_NO_DS4: ${{ matrix.no_ds4 }}
        run: cargo build --release --target ${{ matrix.target }}

      # Each OS gets its usual archive format: a .zip holding plank.exe on
      # Windows, a .tar.gz holding plank everywhere else. PDFium goes beside
      # the binary: liteparse dlopens it at runtime, and otherwise looks only
      # in this runner's download cache, which no user machine has.
      - name: Package binary archive
        id: package
        run: |
          cd "target/${{ matrix.target }}/release"
          case "$RUNNER_OS" in
            Windows) PDFIUM=pdfium.dll ;;
            macOS) PDFIUM=libpdfium.dylib ;;
            *) PDFIUM=libpdfium.so ;;
          esac
          cp "deps/$PDFIUM" .
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARCHIVE="plank-${GITHUB_REF_NAME}-${{ matrix.name }}.zip"
            7z a -tzip "../../../$ARCHIVE" plank.exe "$PDFIUM"
          else
            ARCHIVE="plank-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz"
            tar czf "../../../$ARCHIVE" plank "$PDFIUM"
          fi
          echo "pdfium=$PDFIUM" >> "$GITHUB_OUTPUT"
          cd ../../..
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      # Run the binary out of the archive, not out of target/, so a packaging
      # mistake fails the release instead of shipping.
      - name: Smoke test the archive
        run: |
          mkdir smoke
          ARCHIVE="${{ steps.package.outputs.archive }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z x -osmoke "$ARCHIVE" >/dev/null
            ./smoke/plank.exe --version
          else
            tar xzf "$ARCHIVE" -C smoke
            ./smoke/plank --version
          fi
          test -f "smoke/${{ steps.package.outputs.pdfium }}"

      - name: Upload binary archive to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" --clobber

      # Handed to the checksums job, which writes one SHA256SUMS over every
      # platform's archive.
      - name: Keep binary archive for checksums
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}

      # The WASM plugins shipped nowhere: `guests/` was built only on a
      # developer's disk, so `/plugins install` had nothing to point at and the
      # whole plugin system was unreachable for anyone who downloaded plank.
      # These are the two artifacts that make it reachable.
      #
      # Architecture-independent (wasm32 is wasm32), but built in the matrix job
      # because that is where a toolchain and a checkout already exist. Only
      # the macOS entry builds them, so they are produced exactly once and
      # their SHA256SUMS records the same toolchain as before. `--clobber`
      # keeps a re-run idempotent.
      - name: Add wasm32 target for the guests
        if: runner.os == 'macOS'
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1

      - name: Package plugin archives
        if: runner.os == 'macOS'
        run: sh guests/package.sh

      - name: Upload plugin archives to release
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in guests/dist/plank-*.tar.gz; do
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          done
          # Published alongside, so a user can check what they installed
          # against what the source builds to. It records the rustc version
          # because the bytes are only reproducible for a given toolchain.
          gh release upload "$GITHUB_REF_NAME" guests/dist/SHA256SUMS --clobber

      # A Homebrew bottle's inner directory must match the formula name, so
      # the bottle is packaged under the channel's formula name. Promotion
      # tags a fresh `.0` release (rebuilt by this workflow), so stable never
      # reuses beta bottles.
      - name: Package Homebrew bottle
        if: runner.os == 'macOS'
        run: |
          VERSION="${{ needs.channel.outputs.version }}"
          BOTTLE_TAG="${{ matrix.bottle_tag }}"
          NAME=$([ "${{ needs.channel.outputs.channel }}" = "beta" ] && echo plank-agent-beta || echo plank-agent)
          mkdir -p "$NAME/$VERSION/bin" "$NAME/$VERSION/lib" "$NAME/$VERSION/share/plank/metal"
          cp target/${{ matrix.target }}/release/plank "$NAME/$VERSION/bin/plank"
          chmod +x "$NAME/$VERSION/bin/plank"
          # In lib/, not beside the binary, so Homebrew does not link it into
          # the prefix's bin/; plank looks in ../lib relative to its real path.
          cp target/${{ matrix.target }}/release/deps/libpdfium.dylib "$NAME/$VERSION/lib/"
          # The engine compiles its Metal kernels from source at model load;
          # the binary falls back to ../share/plank/metal relative to itself
          # when the compile-time path (the CI checkout) is gone.
          cp refs/ds4/metal/*.metal "$NAME/$VERSION/share/plank/metal/"
          tar czf "$NAME-$VERSION.$BOTTLE_TAG.bottle.tar.gz" "$NAME/"

      - name: Upload bottle artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.bottle_tag }}
          path: "*.bottle.tar.gz"

  # One checksum file over every platform's binary archive. Named after the
  # tag so it cannot collide with the guests' SHA256SUMS on the same release.
  checksums:
    name: Binary checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true

      - name: Upload SHA256SUMS to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUMS="plank-${GITHUB_REF_NAME}-SHA256SUMS"
          (cd archives && sha256sum plank-* > "../$SUMS")
          cat "$SUMS"
          gh release upload "$GITHUB_REF_NAME" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"

  update-homebrew:
    name: Update Homebrew tap
    needs: [channel, build]
    # `build` fails if any platform does, but only the macOS entry feeds the
    # tap: run whenever its bottle exists, so a Linux or Windows failure never
    # holds back Homebrew. A missing bottle still fails the hash step below.
    if: ${{ !cancelled() && needs.channel.result == 'success' }}
    runs-on: ubuntu-latest
    # Promotion publishes a stable/beta release pair back-to-back; serialize
    # the tap pushes so the second doesn't hit a non-fast-forward.
    concurrency: homebrew-tap
    steps:
      - name: Download bottle artifacts
        uses: actions/download-artifact@v4
        with:
          path: bottles
          merge-multiple: true

      - name: Upload bottles to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in bottles/*.bottle.tar.gz; do
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done

      - name: Download source tarball
        run: curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" -o source.tar.gz

      - name: Compute SHA256 hashes
        id: hashes
        run: |
          VERSION="${{ needs.channel.outputs.version }}"
          CHANNEL="${{ needs.channel.outputs.channel }}"
          FORMULA_NAME=$([ "$CHANNEL" = "beta" ] && echo plank-agent-beta || echo plank-agent)
          echo "formula_name=$FORMULA_NAME" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(sha256sum source.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          for tag in arm64_sequoia; do
            sha=$(sha256sum "bottles/$FORMULA_NAME-$VERSION.$tag.bottle.tar.gz" | awk '{print $1}')
            echo "${tag}_sha=$sha" >> "$GITHUB_OUTPUT"
          done

      - name: Update formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.channel.outputs.version }}"
          CHANNEL="${{ needs.channel.outputs.channel }}"
          FORMULA_NAME="${{ steps.hashes.outputs.formula_name }}"
          SOURCE_SHA="${{ steps.hashes.outputs.source_sha }}"
          ARM64_SEQUOIA_SHA="${{ steps.hashes.outputs.arm64_sequoia_sha }}"

          if [ "$CHANNEL" = "beta" ]; then
            CLASS_NAME=PlankAgentBeta
            DESC="Interactive coding agent with a terminal REPL (beta channel)"
            EXTRA='  conflicts_with "plank-agent", because: "both install a plank binary"'
          else
            CLASS_NAME=PlankAgent
            DESC="Interactive coding agent with a terminal REPL (Rust port of ds4)"
            EXTRA=''
          fi

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/aovestdipaperino/homebrew-tap.git" tap

          cat > "tap/Formula/$FORMULA_NAME.rb" << EOF
          class $CLASS_NAME < Formula
            desc "$DESC"
            homepage "https://github.com/aovestdipaperino/plank"
            url "https://github.com/aovestdipaperino/plank/archive/refs/tags/v${VERSION}.tar.gz"
            sha256 "${SOURCE_SHA}"
            license "MIT"

            depends_on :macos
            # arm64 only: the ds4 Metal backend cannot run on Intel, so a source
            # build there would spend twenty minutes producing a binary with no
            # inference engine. Refuse up front instead of shipping that.
            depends_on arch: :arm64
            depends_on "rust" => :build

            bottle do
              root_url "https://github.com/aovestdipaperino/plank/releases/download/v${VERSION}"
              sha256 cellar: :any_skip_relocation, arm64_sequoia: "${ARM64_SEQUOIA_SHA}"
            end
          ${EXTRA}
            def install
              system "cargo", "install", *std_cargo_args
              # Metal kernel sources are only present when building from a
              # checkout with the refs/ds4 submodule; the GitHub source tarball
              # lacks them (EchoEngine-only build).
              (pkgshare/"metal").install Dir["refs/ds4/metal/*.metal"] unless Dir["refs/ds4/metal/*.metal"].empty?
            end

            test do
              system "#{bin}/plank", "--help"
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/$FORMULA_NAME.rb"
          git diff --cached --quiet || git commit -m "$FORMULA_NAME ${VERSION}"
          git push
