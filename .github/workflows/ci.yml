name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # The default build includes `plugins` now, so this job compiles the
          # WASM host and the guest-backed tests. Without the cross target the
          # guests below cannot be built and those tests would silently skip.
          # csvedit is the one guest on wasm32-wasip1 (Turbo Vision reads the
          # clock, which needs WASI).
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      # `liteparse-pdfium-sys`'s build script downloads pdfium into
      # ~/.cache/pdfium-rs, bakes that path into the binary, and copies the
      # dylib into target/<profile>/deps. rust-cache restores target/ but not
      # that cache dir, so on a cache hit the script never re-runs: nothing
      # re-downloads, and the baked path points at a directory the runner does
      # not have. Every `doc::` test then dies in dlopen with "could not find
      # pdfium shared library". Keyed on Cargo.lock so a dependency bump (and
      # with it a new pdfium release tag) misses the cache and re-downloads.
      - name: Cache pdfium binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/pdfium-rs
          key: pdfium-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          # Deliberately no restore-keys: the build script takes whatever is in
          # the cache dir if it exists, so a partial-key restore would hand a
          # bumped liteparse-pdfium the previous release's binaries instead of
          # downloading its own.

      # Not `--all`: plank is a single package whose path dependencies point
      # into the vendored submodules (`obscura`, `edit`), and `--all` reaches
      # into them. Their code is upstream's and is not formatted to plank's
      # rustfmt.toml, so `--all` failed here on every push while saying nothing
      # about plank's own source.
      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The cache above can be evicted while rust-cache's target/ stays warm,
      # which puts us right back in the broken state: the build script is
      # considered up to date, so it never re-downloads. Force it to re-run by
      # discarding just that crate's artifacts when the download is missing.
      - name: Ensure pdfium is downloadable
        run: |
          if [ ! -d "$HOME/.cache/pdfium-rs" ]; then
            echo "pdfium cache absent; forcing liteparse-pdfium-sys to rebuild"
            cargo clean -p liteparse-pdfium-sys --release || true
          fi

      # Before the test step: the guest-backed suite skips when the artifacts
      # are absent, so building them late would leave a green job that ran
      # nothing. `PLANK_REQUIRE_GUESTS` turns that skip into a failure so the
      # ordering cannot silently regress.
      - name: Build WASM guests
        run: |
          sh spike/build-guest.sh
          sh guests/build.sh

      # guests/csvedit is the plank-csvedit submodule; the checkout above is
      # recursive, so it is present here at its pinned commit.
      - name: Test the CSV editor guest natively
        run: cargo test --manifest-path guests/csvedit/Cargo.toml --lib

      - name: Package plugin archives
        run: sh guests/package.sh

      - name: Verify the guests rebuild to the same bytes
        run: |
          cp guests/dist/SHA256SUMS /tmp/guest-sums
          sh guests/verify.sh /tmp/guest-sums

      - name: Build
        run: cargo build --release --verbose

      - name: Test
        env:
          PLANK_REQUIRE_GUESTS: "1"
        run: cargo test --release --verbose

      # A workspace member, so `cargo test` above does not reach it: the FFI
      # struct-offset pins live here since the engine moved into its own crate,
      # and so do the Gemma routing tests (a generated tiny GGUF, CPU only).
      - name: Test the local inference crate
        run: cargo test --release -p local-inference-engine

      # Also a workspace member the steps above miss, and its kernels sit
      # behind the `candle` feature, which neither the default clippy run nor
      # the pre-commit hook enables. The Metal tests skip themselves when the
      # runner has no GPU; the real-GGUF checks live in tests/ and need the
      # model, so `--lib` leaves them out.
      - name: Lint the Flint engine crate
        run: cargo clippy -p flint-engine --all-targets --features candle -- -D warnings

      - name: Test the Flint engine crate
        run: cargo test --release -p flint-engine --features candle --lib

  # `plugins` is on by default now, so the default job above covers it. This
  # job guards the other direction: the lean build, without the WASM host. That
  # configuration is the one that can rot unnoticed — every `#[cfg(feature =
  # "plugins")]` boundary and the no-op `WasmHost` only compile here.
  #
  # Not `--no-default-features` alone, which would also drop the editor, doc
  # parsing and images and test a build nobody ships. Everything except plugins.
  lean:
    name: Build & test (no plugins)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: lean

      - name: Cache pdfium binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/pdfium-rs
          key: pdfium-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Ensure pdfium is downloadable
        run: |
          if [ ! -d "$HOME/.cache/pdfium-rs" ]; then
            echo "pdfium cache absent; forcing liteparse-pdfium-sys to rebuild"
            cargo clean -p liteparse-pdfium-sys || true
          fi

      - name: Clippy (no plugins)
        run: |
          cargo clippy --all-targets --no-default-features \
            --features use_obscura,builtin_editor,docparse,images -- -D warnings

      - name: Test (no plugins)
        run: |
          cargo test --no-default-features \
            --features use_obscura,builtin_editor,docparse,images --verbose

  # Linux and Windows (#89). The default features, without the ds4 C engine,
  # which `crates/local-inference-engine` builds on macOS only: Gemma and
  # Flint run on candle's CPU path here. The WASM guests are not built, so the
  # guest-backed tests skip (PLANK_REQUIRE_GUESTS is unset); the macOS job
  # above is the one that holds them. Both runner images ship cmake, which
  # `docparse` needs for Tesseract.
  portable:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLANK_NO_DS4: "1"
      # The MSVC main-thread stack is 1 MB; the async-heavy tests need more.
      RUST_MIN_STACK: "8388608"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: portable

      # See the macOS job: the pdfium download lives outside target/.
      - name: Cache pdfium binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/pdfium-rs
          key: pdfium-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Ensure pdfium is downloadable
        shell: bash
        run: |
          if [ ! -d "$HOME/.cache/pdfium-rs" ]; then
            cargo clean -p liteparse-pdfium-sys || true
          fi

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # `--release`, as in the macOS job, and here also required: tesseract-rs
      # 0.2.0 looks for `leptonica-1.84.1.lib`, but an MSVC Debug build names
      # it `leptonica-1.84.1d.lib`, so a debug test build fails to link.
      - name: Test
        run: cargo test --release --lib

      # The native engines on the CPU (#89 step 5): workspace members the
      # steps above miss. Their kernels sit behind `candle`, and the
      # real-GGUF reference tests are `#[ignore]`d without a model, so this
      # runs the kernel, session and template checks (template_parity
      # included) and the routing tests on a generated tiny GGUF.
      - name: Lint the native engine crates
        run: cargo clippy -p gemma-engine -p flint-engine --all-targets --features candle -- -D warnings

      # bash on Windows too: under pwsh a failing first line would be masked
      # by the exit status of the last.
      - name: Test the native engine crates
        shell: bash
        run: |
          set -e
          cargo test --release -p gemma-engine --features candle
          cargo test --release -p flint-engine --features candle
          cargo test --release -p local-inference-engine
