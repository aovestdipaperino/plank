name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `liteparse-pdfium-sys`'s build script downloads pdfium into
      # ~/.cache/pdfium-rs, bakes that path into the binary, and copies the
      # dylib into target/<profile>/deps. rust-cache restores target/ but not
      # that cache dir, so on a cache hit the script never re-runs: nothing
      # re-downloads, and the baked path points at a directory the runner does
      # not have. Every `doc::` test then dies in dlopen with "could not find
      # pdfium shared library". Keyed on Cargo.lock so a dependency bump (and
      # with it a new pdfium release tag) misses the cache and re-downloads.
      - name: Cache pdfium binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/pdfium-rs
          key: pdfium-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          # Deliberately no restore-keys: the build script takes whatever is in
          # the cache dir if it exists, so a partial-key restore would hand a
          # bumped liteparse-pdfium the previous release's binaries instead of
          # downloading its own.

      # Not `--all`: plank is a single package whose path dependencies point
      # into the vendored submodules (`obscura`, `edit`), and `--all` reaches
      # into them. Their code is upstream's and is not formatted to plank's
      # rustfmt.toml, so `--all` failed here on every push while saying nothing
      # about plank's own source.
      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The cache above can be evicted while rust-cache's target/ stays warm,
      # which puts us right back in the broken state: the build script is
      # considered up to date, so it never re-downloads. Force it to re-run by
      # discarding just that crate's artifacts when the download is missing.
      - name: Ensure pdfium is downloadable
        run: |
          if [ ! -d "$HOME/.cache/pdfium-rs" ]; then
            echo "pdfium cache absent; forcing liteparse-pdfium-sys to rebuild"
            cargo clean -p liteparse-pdfium-sys --release || true
          fi

      - name: Build
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --release --verbose

  # The `plugins` feature was entirely unbuilt by CI: the default job compiles
  # no wasmtime, so every Extism call site and all 31 integration tests were
  # verified only on whichever laptop last remembered to run them. This job is
  # what makes the plugin system continuously verified.
  #
  # Deliberately not `--release`: the point is to compile the feature and run
  # the guest-backed tests, and a debug wasmtime builds in a fraction of the
  # time. The default job already covers the release profile.
  plugins:
    name: Build & test (plugins feature)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # The guests are cross-compiled; without this target
          # `spike/build-guest.sh` fails and the tests below would silently
          # have nothing to run.
          targets: wasm32-unknown-unknown

      # A distinct prefix: this job's target/ holds a debug build with wasmtime
      # in it, which has nothing in common with the default job's release
      # artifacts. Sharing one cache key would have them evicting each other.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: plugins

      # Same reasoning as the default job's pdfium cache: the build script
      # bakes an absolute path into the binary, so a restored target/ with a
      # missing cache dir dies in dlopen.
      - name: Cache pdfium binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/pdfium-rs
          key: pdfium-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Ensure pdfium is downloadable
        run: |
          if [ ! -d "$HOME/.cache/pdfium-rs" ]; then
            echo "pdfium cache absent; forcing liteparse-pdfium-sys to rebuild"
            cargo clean -p liteparse-pdfium-sys || true
          fi

      # Before the test step, not after: the suite skips when the artifacts are
      # absent, so building them late would leave a green job that ran nothing.
      # `PLANK_REQUIRE_GUESTS` below turns that skip into a failure so the
      # ordering cannot silently regress.
      - name: Build WASM guests
        run: |
          sh spike/build-guest.sh
          sh guests/build.sh

      # The shared guest crate has the only tests that pin the RNG sequence and
      # the glyph wire format, and it is a separate crate targeting the host, so
      # the workspace's own `cargo test` never reaches it.
      - name: Test the shared guest crate
        run: cargo test --manifest-path guests/support/Cargo.toml

      # Packaging is verified here rather than only at release time: it is the
      # step that turns a `.wasm` into something installable, and the plugin
      # manifests it copies are the only thing standing between a release and a
      # plugin whose component silently never appears. It also produces the
      # artifact `the_real_packaged_artifact_installs` consumes.
      - name: Package plugin archives
        run: sh guests/package.sh

      # The trust store keys on a module's SHA-256, so a published artifact
      # nobody can independently reproduce makes that hash an assertion rather
      # than a check. The modules are byte-reproducible on a given toolchain,
      # from any build directory, and this is what keeps that true rather than
      # assumed: a clean rebuild must land on the same bytes.
      - name: Verify the guests rebuild to the same bytes
        run: |
          cp guests/dist/SHA256SUMS /tmp/guest-sums
          sh guests/verify.sh /tmp/guest-sums

      - name: Clippy (plugins)
        run: cargo clippy --all-targets --features plugins -- -D warnings

      - name: Test (plugins)
        env:
          PLANK_REQUIRE_GUESTS: "1"
        run: cargo test --features plugins --verbose
