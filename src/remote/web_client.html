<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plank remote</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column;
    background: #111; color: #ddd;
  }
  @media (prefers-color-scheme: light) {
    body { background: #fafafa; color: #222; }
  }
  header {
    display: flex; gap: .5rem; align-items: center;
    padding: .5rem .75rem; border-bottom: 1px solid #444; flex-wrap: wrap;
  }
  header button { padding: .3rem .7rem; font: inherit; cursor: pointer; }
  #status { font-size: .85em; opacity: .8; }
  #log {
    flex: 1 1 auto; overflow-y: auto; padding: .75rem;
    white-space: pre-wrap; word-break: break-word; line-height: 1.35;
  }
  #log .think { opacity: .6; font-style: italic; }
  #log .tool  { color: #4ea1ff; }
  #log .error { color: #ff6b6b; }
  #log .dim   { opacity: .55; }
  #log .echo  { color: #9ad36b; }
  form.input { display: flex; gap: .5rem; padding: .5rem .75rem;
    border-top: 1px solid #444; }
  form.input select { font: inherit; }
  form.input input { flex: 1 1 auto; padding: .4rem .5rem; font: inherit;
    background: transparent; color: inherit; border: 1px solid #555;
    border-radius: 4px; }
  form.input button { padding: .4rem .9rem; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<header>
  <strong>plank remote</strong>
  <button id="interrupt" disabled>interrupt</button>
  <button id="control" disabled>take control</button>
  <span id="role" class="dim"></span>
  <span id="status">disconnected</span>
</header>
<div id="log" aria-live="polite"></div>
<form class="input" id="inputForm">
  <select id="kind" title="frame kind">
    <option value="prompt">prompt</option>
    <option value="command">command</option>
    <option value="btw">btw</option>
  </select>
  <input id="line" placeholder="type a line and press Enter" autocomplete="off">
  <button type="submit">send</button>
</form>
<script>
"use strict";
// Wire protocol version this client speaks; must match PROTOCOL_VERSION in
// src/remote/control.rs.
const PROTOCOL_VERSION = 1;

const $ = (id) => document.getElementById(id);
const logEl = $("log");
let ws = null;
let highestId = null;
// Whether this session believes it holds control. The server has no
// "control granted" frame — a granted `request_control` is silent and only a
// refusal comes back as `control_denied` (src/remote/control.rs:1250) — so this
// is optimistic: we assume the request landed and a `control_denied` reverts it.
let controller = false;

function setStatus(s) { $("status").textContent = s; }

// Reflects the control role in the toggle button and the header hint.
function setRole(isController) {
  controller = isController;
  $("control").textContent = isController ? "release control" : "take control";
  $("role").textContent = isController ? "controller" : "mirror";
}

function append(text, cls) {
  const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = text;
  logEl.appendChild(span);
  if (atBottom) logEl.scrollTop = logEl.scrollHeight;
}

function line(text, cls) { append(text + "\n", cls); }

function handleServerMsg(f) {
  if (typeof f.id === "number") highestId = f.id;
  switch (f.type) {
    case "hello":
      line("[connected: plank " + f.plank_version + ", session " +
        f.session_id + (f.controller ? ", controller" : ", mirror") + "]", "dim");
      setRole(!!f.controller);
      break;
    case "snapshot":
      if (f.highest_id !== null && f.highest_id !== undefined)
        highestId = f.highest_id;
      for (const e of (f.scrollback || [])) handleServerMsg(e);
      break;
    case "visible":   append(f.text); break;
    case "think":     append(f.text, "think"); break;
    case "tool":      append(f.text, "tool"); break;
    case "error":     append(f.text, "error"); break;
    case "dim":       append(f.text, "dim"); break;
    case "plain":     append(f.text); break;
    case "user_echo": line("> " + f.text, "echo"); break;
    case "end_line":  append("\n"); break;
    case "btw_begin": line("[btw]", "dim"); break;
    case "btw_end":   break;
    case "main_checkpoint": break;
    case "main_rollback": break;
    case "status": {
      const s = f.status;
      setStatus(s.state + "  ctx " + s.ctx_used + "/" + s.ctx_size +
        (s.gen_tps ? "  " + s.gen_tps.toFixed(1) + " tok/s" : ""));
      break;
    }
    // Any refusal means we are not the controller, whatever we assumed.
    case "control_denied":
      line("[denied: " + f.reason + "]", "error");
      setRole(false);
      break;
    case "pong": break;
    case "bye": line("[server: " + f.reason + "]", "dim"); break;
    default: break;
  }
}

function send(msg) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify(Object.assign({ v: PROTOCOL_VERSION }, msg)));
}

function connect() {
  // Always this page's own origin: the server serves the client, so the socket
  // and the page are necessarily the same host and port.
  const url = "ws://" + location.host + "/";
  if (ws) { try { ws.close(); } catch (_) {} }
  setStatus("connecting…");
  // close() is async: the old socket's handlers can still fire after `ws` is
  // reassigned (even after the new socket's onopen), so every handler below
  // captures its own socket and ignores events once it's no longer current.
  const sock = new WebSocket(url);
  ws = sock;
  sock.onopen = () => {
    if (sock !== ws) return;
    setStatus("authenticating…");
    const auth = { type: "auth", token: linkToken };
    if (highestId !== null) auth.resume_from = highestId;
    send(auth);
    $("interrupt").disabled = false;
    $("control").disabled = false;
    // Opening the `/remote-control` link is the operator's own consent, so claim
    // control immediately rather than waiting for a click: `/rc` always starts
    // the server with allow_control, making this a silent Granted.
    send({ type: "request_control" });
    setRole(true);
    line("[requested control]", "dim");
  };
  sock.onmessage = (ev) => {
    if (sock !== ws) return;
    let f; try { f = JSON.parse(ev.data); } catch (_) { return; }
    handleServerMsg(f);
    if (f.type === "hello") setStatus("connected");
  };
  sock.onclose = (ev) => {
    if (sock !== ws) return;
    setStatus("disconnected" + (ev.code ? " (" + ev.code + ")" : ""));
    $("interrupt").disabled = true;
    $("control").disabled = true;
    $("role").textContent = "";
    controller = false;
  };
  sock.onerror = () => {
    if (sock !== ws) return;
    setStatus("error");
  };
}

$("interrupt").addEventListener("click", () => send({ type: "interrupt" }));
// Hand control back, and take it again afterwards. The page claims control on
// connect, so this is only reached after a deliberate release — or after a
// `control_denied` flipped the role back to mirror, which happens when a
// previous session still holds the slot inside its reconnect grace window.
$("control").addEventListener("click", () => {
  if (controller) {
    send({ type: "release_control" });
    setRole(false);
    line("[released control]", "dim");
  } else {
    send({ type: "request_control" });
    setRole(true);
    line("[requested control]", "dim");
  }
});
$("inputForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const el = $("line");
  const text = el.value;
  if (!text) return;
  const kind = $("kind").value; // prompt | command | btw
  send({ type: kind, text });
  el.value = "";
});

// `/remote-control` prints http://HOST:PORT/?t=TOKEN and that link is the only
// way in: the token exists nowhere else, so a page reached without one has
// nothing to authenticate with and there is no manual entry to fall back to.
const linkToken = new URLSearchParams(location.search).get("t");
if (linkToken) {
  connect();
} else {
  setStatus("no token");
  line("[open the link printed by /rc — this page needs the token from its ?t= parameter]", "error");
}
</script>
</body>
</html>
