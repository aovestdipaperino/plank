# The arcade, as one WASM component.
#
# Every face lives in this single module rather than one module per game: one
# artifact to build, one id to trust, one load. `frame_open`'s `arg` selects
# which face, and each face gets its own slash command through `command_specs`.
#
# Not a workspace member of plank: it targets wasm32-unknown-unknown, so
# folding it in would drag a cross-target into every `cargo build`.
[workspace]

[package]
name = "plank-arcade"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"

[profile.release]
opt-level = "s"
strip = true
