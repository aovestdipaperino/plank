# A Turbo Vision CSV editor as a plank frame component. Not a workspace
# member of plank: it targets wasm32-wasip1 (WASI makes Instant::now() work,
# which Turbo Vision needs). Native `cargo test` runs the pure modules.
[workspace]

[package]
name = "plank-csvedit"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1"
plank-guest-support = { path = "../support" }
# Turbo Vision without its terminal (`default-features = false` drops the
# `native` feature: crossterm and arboard), from the `wasm-host-driven`
# branch until a release carries HostBackend and Application::pump.
turbo-vision = { git = "https://github.com/aovestdipaperino/turbo-vision-4-rust", rev = "37d71c25f84c395f93f2eb531676df9684c1aabf", default-features = false }

[profile.release]
opt-level = "s"
strip = true
