[package]
name = "gemma-engine"
version = "0.1.0"
description = "Gemma 4 inference in native Rust (candle): chat template, GGUF tokenizer, quantized forward pass, prefix-truncatable KV"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
candle = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers", "dep:sha2", "dep:half"]
testgguf = ["candle"]

[dependencies]
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["fancy-regex"] }
sha2 = { version = "0.11", optional = true }
half = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", optional = true, features = ["metal"] }
candle-nn = { version = "0.11", optional = true, features = ["metal"] }

[lints]
workspace = true
