[package]
name = "flint-engine"
version = "0.1.0"
description = "Flint inference in native Rust (candle): NVFP4 kernels, GGUF loading, MoE forward pass"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
candle = [
    "dep:candle-core",
    "dep:memmap2",
    "dep:rayon",
    "dep:candle-metal-kernels",
    "dep:objc2-metal",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:block2",
    "dep:libc",
    "gemma-engine/candle",
    "dep:candle-nn",
    "dep:tokenizers",
    "dep:sha2",
]
testgguf = ["candle"]

[dependencies]
candle-core = { version = "0.9", optional = true }
memmap2 = { version = "0.9", optional = true }
rayon = { version = "1", optional = true }
gemma-engine = { path = "../gemma-engine" }
candle-nn = { version = "0.9", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["fancy-regex"] }
sha2 = { version = "0.11", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", optional = true, features = ["metal"] }
candle-nn = { version = "0.9", optional = true, features = ["metal"] }
candle-metal-kernels = { version = "0.9", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
block2 = { version = "0.6", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

[[example]]
name = "bench_kernels"
required-features = ["candle"]

[[example]]
name = "bench_decode"
required-features = ["candle"]

[[example]]
name = "bench_depth"
required-features = ["candle"]
