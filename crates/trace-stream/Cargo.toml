[package]
name = "trace-stream"
version = "0.1.3"
description = "Streaming renderer for model token streams: tool-call parsing, thinking-text split, and markdown/syntax highlighting to ANSI"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["llm", "streaming", "markdown", "ansi", "terminal"]
categories = ["command-line-interface", "text-processing"]
readme = "README.md"

[features]
# The Qwen3.8-Flash-Next tool-call dialect (`<tool_call>` / `<function=…>`).
# Off by default: plank does not build Qwen support by default either, and with
# it off `qwen_stub.rs` stands in for the parser so `viz.rs` needs no `#[cfg]`
# on the dialect dispatch it runs for every generation.
qwen = []

[dependencies]

[lints]
workspace = true
