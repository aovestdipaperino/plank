[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gguf-delta"
version = "0.1.0"
description = "Load .ggd weight deltas between same-layout GGUF files (ctypes binding over libgguf_delta)"
readme = "../README.md"
license = { text = "MIT" }
authors = [{ name = "Enzo Lombardi", email = "enzinol@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/aovestdipaperino/plank"

[tool.setuptools.packages.find]
where = ["."]
include = ["gguf_delta*"]
